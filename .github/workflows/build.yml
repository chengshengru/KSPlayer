on:
  push:
    branches:
      - "release"

jobs:
  buidJob:
    name: build (Xcode ${{ matrix.xcode }})
    # 双工具链兼容矩阵:Xcode 14.2(Swift 5.7)~ 26.6(Swift 6.2+)
    # 注:Xcode 14.2 一档在 KSPlayer.xcframework 完成 5.7 重编(移植方案 M2)之前会因二进制 interface 加载失败而红,
    # 故对该档设置 continue-on-error,M2 完成后移除该行即可将其转为合入门禁。
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "14.2"
            runner: macos-13
          - xcode: "15.4"
            runner: macos-13
          - xcode: "16.4"
            runner: macos-15
          - xcode: "26.6"
            runner: macos-26
    steps:
      - uses: actions/checkout@main
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      #      https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md#xcode
      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
          xcode-select -p
          xcodebuild -version
      - name: Build macOS
        continue-on-error: ${{ matrix.xcode == '14.2' }}
        run: swift build
      # - name: Build iOS
      #   run: swift build --sdk `xcrun -sdk iphonesimulator -show-sdk-path` -Xswiftc -target -Xswiftc x86_64-apple-ios13.0-simulator -Xcc -target -Xcc x86_64-apple-ios13.0-simulator
      # - name: Build tvOS
      #   run: swift build --sdk `xcrun -sdk appletvsimulator -show-sdk-path` -Xswiftc -target -Xswiftc x86_64-apple-tvos13.0-simulator -Xcc -target -Xcc x86_64-apple-tvos13.0-simulator
      # - name: Build xrOS
      #   run: swift build --sdk `xcrun -sdk xrsimulator -show-sdk-path` -Xswiftc -target -Xswiftc x86_64-apple-xros1.0-simulator -Xcc -target -Xcc x86_64-apple-xros1.0-simulator
      # - name: Test
      #   run: swift test -v
